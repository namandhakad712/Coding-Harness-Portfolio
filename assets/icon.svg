<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="body" cx="38%" cy="30%" r="78%">
      <stop offset="0%"  stop-color="#ffd9c8"/>
      <stop offset="46%" stop-color="#ff9d85"/>
      <stop offset="100%" stop-color="#e0604f"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ef0b2"/>
      <stop offset="100%" stop-color="#4bc97c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe6db" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffe6db" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="33" cy="57" rx="17" ry="4.2" fill="#000" opacity=".28"/>

  <!-- sprout -->
  <path d="M32 17 C32 11 31 8 30.5 5" stroke="#3f9c68" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <path d="M31 9 C24 8 20 10 18 13 C23 16 29 15 31.5 11 Z" fill="url(#leaf)"/>
  <path d="M32 6 C38 4 43 6 45 9 C41 13 35 12 32 8 Z" fill="url(#leaf)" opacity=".92"/>

  <!-- body -->
  <circle cx="32" cy="37" r="22" fill="url(#body)"/>
  <!-- top rim light = the "3D" read -->
  <path d="M12 30 A22 22 0 0 1 52 30 A26 20 0 0 0 12 30 Z" fill="url(#rim)"/>
  <!-- crease -->
  <path d="M32 17 C28 24 28 32 31 40" stroke="#d4574a" stroke-width="1.6" fill="none" opacity=".45" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="19" cy="43" rx="4.6" ry="3.1" fill="#ff5f7a" opacity=".55"/>
  <ellipse cx="45" cy="43" rx="4.6" ry="3.1" fill="#ff5f7a" opacity=".55"/>

  <!-- old-cartoon eyes: tall white oval, small dark oval low inside -->
  <ellipse cx="25" cy="35" rx="4.3" ry="5.6" fill="#fff"/>
  <ellipse cx="39" cy="35" rx="4.3" ry="5.6" fill="#fff"/>
  <ellipse cx="25" cy="37.4" rx="2.5" ry="2.4" fill="#1a1110"/>
  <ellipse cx="39" cy="37.4" rx="2.5" ry="2.4" fill="#1a1110"/>
  <circle cx="24.1" cy="36.5" r=".8" fill="#fff"/>
  <circle cx="38.1" cy="36.5" r=".8" fill="#fff"/>
</svg>
